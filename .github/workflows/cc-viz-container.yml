name: Build CC visualization container

on:
  workflow_dispatch:
  push:
    tags:
      - "cc-viz-v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name and tag
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="cc-viz-${GITHUB_REF_NAME#cc-viz-v}"
          else
            tag="cc-viz-latest"
          fi
          echo "name=$image:$tag" >> "$GITHUB_OUTPUT"

      - name: Build and publish standard CUDA FastSurfer image
        shell: bash
        run: |
          uv run python tools/Docker/build.py \
            --device cuda \
            --target runtime \
            --tag "${{ steps.image.outputs.name }}" \
            --action push \
            --cache type=gha,scope=cc-viz,mode=max
